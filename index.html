<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c">
<title>Taller · villacreces competición</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0d0c;--card:#151917;--ink:#eef2ee;--mut:#8f9993;--line:#2a312d;--acc:#3dfd24;
--pendiente:#8a9094;--en_curso:#2f7de1;--esperando_piezas:#e07a1f;--listo:#2e9b5b;--entregado:#7d8782}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,button,.tag,label{font-family:"Barlow Semi Condensed",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:26px;margin:0;font-weight:700;border-left:6px solid var(--acc);padding-left:10px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:10px 14px;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.acc{background:var(--acc);color:#06150b}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--en_curso);outline-offset:1px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.filtros{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.filtros button{white-space:nowrap}
.filtros button.on{background:var(--acc);color:#06150b;border-color:var(--acc)}
.fila{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:6px;padding:12px;margin-bottom:8px}
.fila b{font-family:"Barlow Semi Condensed";font-size:19px}
.fila small{color:var(--mut);display:block}
.tag{font-size:14px;font-weight:600;color:var(--c)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.tarea{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tarea input{width:26px;height:26px;flex:none}
.tarea.ok span{text-decoration:line-through;color:var(--mut)}
.tarea small{color:var(--mut);margin-left:auto}
.vacio{color:var(--mut);text-align:center;padding:28px 0}
.err{color:#ff6b6b;min-height:1.3em}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:10px 0 4px;font-weight:600}
.btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.add{display:flex;gap:8px;margin-top:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:1 0 auto;white-space:nowrap;background:transparent;color:var(--ink);border:1px solid var(--line)}.tabs button.on{background:var(--acc);color:#06150b;border-color:var(--acc)}
.al{background:#d23b3b;color:#fff;border-radius:10px;padding:0 7px;margin-left:4px}
.aviso{background:#d23b3b22;border:1px solid #d23b3b;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-weight:600}
.pieza{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.pieza small{display:block}
.pieza img,.sinfoto{width:76px;height:76px;object-fit:cover;border-radius:6px;flex:none;background:var(--line);cursor:pointer}
.warn{color:var(--esperando_piezas)}.bad{color:#ff6b6b}.oks{color:var(--listo)}
.lin{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:end}.lin label{flex:1;font-weight:600}
.tot{display:flex;justify-content:space-between;padding:3px 0}
.marca{display:flex;align-items:center;gap:12px}.logo{width:min(220px,46vw);height:auto}.logo.grande{width:min(340px,100%);display:block;margin:0 auto 16px}
.reloj{font:700 44px 'Barlow Semi Condensed',sans-serif;color:var(--acc);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.hfoto{max-width:100%;max-height:220px;border-radius:6px;margin-top:6px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal b{font:600 13px 'Barlow Semi Condensed',sans-serif;color:var(--mut)}
.cal button{padding:6px 0;min-height:46px;background:var(--card);color:var(--ink);border:1px solid var(--line)}.cal button.hoy{border-color:var(--acc)}.cal button.sel{background:var(--acc);color:#06150b}
.cal .p{display:flex;gap:3px;justify-content:center;margin-top:3px;height:6px}.cal .p i{width:6px;height:6px;border-radius:50%;background:var(--en_curso)}.cal .p i.t{background:var(--esperando_piezas)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<dialog id="dlg">
  <form method="dialog" id="fnuevo">
    <h2 style="margin:0">Entra al taller</h2>
    <label for="n_tipo">Tipo</label>
    <select id="n_tipo"><option value="coche">Coche</option><option value="motor">Motor</option></select>
    <label for="n_nombre">Marca y modelo</label><input id="n_nombre" required placeholder="Ej. Peugeot 106 Rallye">
    <label for="n_mat">Matrícula (opcional)</label><input id="n_mat">
    <label for="n_cli">Cliente / piloto (opcional)</label><input id="n_cli">
    <div class="btns"><button type="button" class="sec" id="n_cancel">Cancelar</button><button class="acc">Guardar</button></div>
  </form>
</dialog>

<dialog id="dlga">
  <form method="dialog" id="fnuevoa">
    <h2 style="margin:0">Pieza nueva en el almacén</h2>
    <label for="a_nom">Nombre</label><input id="a_nom" required>
    <label for="a_ref">Referencia (opcional)</label><input id="a_ref">
    <label for="a_ubi">Ubicación (opcional)</label><input id="a_ubi" placeholder="Estantería 2, balda 3">
    <label for="a_uni">Unidades</label><input id="a_uni" type="number" min="0" value="0">
    <label for="a_min">Avisar cuando queden…</label><input id="a_min" type="number" min="0" value="1">
    <label for="a_pre">Precio de venta por unidad (€)</label><input id="a_pre" type="number" min="0" step="0.01" value="0">
    <div class="btns"><button type="button" class="sec" id="a_cancel">Cancelar</button><button class="acc">Guardar</button></div>
  </form>
</dialog>

<dialog id="dlgf">
  <form method="dialog" id="fnuevof">
    <h2 style="margin:0">Vehículo de asistencia</h2>
    <label for="f_nom">Nombre</label><input id="f_nom" required placeholder="Ej. Furgoneta Transit">
    <label for="f_tipo">Tipo</label><select id="f_tipo"><option>Furgoneta</option><option>Remolque</option><option>Coche</option><option>Camión</option><option>Otro</option></select>
    <label for="f_mat">Matrícula (opcional)</label><input id="f_mat">
    <label for="f_km">Kilómetros (opcional)</label><input id="f_km" type="number" min="0">
    <label for="f_itv">Próxima ITV (opcional)</label><input id="f_itv" type="date">
    <label for="f_seg">Vencimiento del seguro (opcional)</label><input id="f_seg" type="date">
    <div class="btns"><button type="button" class="sec" id="f_cancel">Cancelar</button><button class="acc">Guardar</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
// ====== 1) Pega aquí los datos de tu proyecto (Supabase > Project Settings > API) ======
const SUPABASE_URL = 'https://xgowqywwgelqfgkhizxh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2WBcMj-a3xCXOukow-9lng_1Cfdbj3w';
// =======================================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const ESTADOS = [['pendiente','Pendiente'],['en_curso','En curso'],['esperando_piezas','Esperando piezas'],['listo','Listo'],['entregado','Entregado']];
const NOM = Object.fromEntries(ESTADOS);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, vehs = [], filtro = 'activos', selId = null, tareas = [], timer, vista = 'coche', alm = [], piezas = [], urls = {}, lineas = [], hist = [], fich = [], tarifa = 0, agenda = [], flota = [], fm = [], equipo = [], selFlota = null, mes = new Date(), dia = null;

async function boot() {
  const { data } = await sb.auth.getSession();
  data.session ? await entrar(data.session.user) : login();
  sb.auth.onAuthStateChange((e, s) => { if (e === 'SIGNED_OUT') login(); });
}
function login(msg = '') {
  $('#app').innerHTML = `<div class="box" style="margin-top:12vh"><img src="logo.png" class="logo grande" alt="" onerror="this.remove()"><h1>Taller</h1><p style="color:var(--mut)">villacreces competición</p>
  <label for="em">Correo</label><input id="em" type="email" autocomplete="username">
  <label for="pw" style="display:block;margin-top:10px">Contraseña</label><input id="pw" type="password" autocomplete="current-password">
  <p class="err" id="err">${esc(msg)}</p><button class="acc" id="go" style="width:100%">Entrar</button></div>`;
  const go = async () => {
    const { data, error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    error ? $('#err').textContent = 'Correo o contraseña incorrectos.' : entrar(data.user);
  };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}
async function entrar(user) {
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
  me = data || { nombre: user.email, rol: 'mecanico' };
  const eq = await sb.from('profiles').select('nombre'); equipo = (eq.data || []).map(x => x.nombre);
  sb.channel('taller').on('postgres_changes', { event: '*', schema: 'public' }, () => {
    clearTimeout(timer); timer = setTimeout(refrescar, 300);
  }).subscribe();
  await refrescar();
}
async function refrescar() {
  const [v, a, aj, ag, fl] = await Promise.all([sb.from('vehiculos').select('*, tareas(id,hecha)').order('created_at', { ascending: false }), sb.from('almacen').select('*').order('nombre'), sb.from('ajustes').select('*').eq('clave', 'precio_hora'), sb.from('agenda').select('*').order('fecha').order('hora', { nullsFirst: true }), sb.from('flota').select('*').order('nombre')]);
  vehs = v.data || []; alm = a.data || []; tarifa = +(aj.data && aj.data[0] && aj.data[0].valor) || 0; agenda = ag.data || []; flota = fl.data || [];
  if (selId) {
    await cargarDetalle();
    // no pisar lo que se está escribiendo
    if (!document.activeElement || !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) detalle();
    return;
  }
  if (selFlota) { await cargarFlota(); if (!document.activeElement || !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) flotaDetalle(); return; }
  if (vista === 'agenda' && document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  ({ almacen: almacenView, agenda: agendaView, flota: flotaView }[vista] || lista)();
}
async function cargarDetalle() {
  const q = tb => sb.from(tb).select('*').eq('vehiculo_id', selId);
  const [t, p, l, h, f] = await Promise.all([q('tareas').order('created_at'), q('piezas').order('created_at'), q('lineas_prefactura').order('created_at'), q('historial').order('created_at', { ascending: false }), q('fichajes').order('inicio')]);
  tareas = t.data || []; piezas = p.data || []; lineas = l.data || []; hist = h.data || []; fich = f.data || [];
  const falta = [...piezas, ...hist].map(x => x.foto).filter(f => f && !urls[f]);
  if (falta.length) { const r = await sb.storage.from('fotos').createSignedUrls(falta, 86400); (r.data || []).forEach(o => { if (o.signedUrl) urls[o.path] = o.signedUrl; }); }
}
function cabecera() {
  const bajos = alm.filter(a => a.unidades <= a.minimo).length, pa = agenda.filter(x => x.tipo === 'tarea' && !x.hecha && x.fecha <= hoyISO()).length, pf = flota.reduce((n, f) => n + ['itv_fecha', 'seguro_fecha'].filter(k => f[k] && dias(f[k]) <= 30).length, 0);
  return `<header><div class="marca"><img src="logo.png" class="logo" alt="villacreces competición" onerror="this.remove()"><h1>Taller</h1></div><button class="sec" id="salir">Salir</button></header>
  <nav class="tabs"><button class="${vista==='coche'?'on':''}" data-v="coche">Coches (${vehs.filter(x => x.tipo === 'coche' && x.estado !== 'entregado').length})</button><button class="${vista==='motor'?'on':''}" data-v="motor">Motores (${vehs.filter(x => x.tipo === 'motor' && x.estado !== 'entregado').length})</button><button class="${vista==='almacen'?'on':''}" data-v="almacen">Almacén${bajos ? ` <span class="al">${bajos}</span>` : ''}</button><button class="${vista==='agenda'?'on':''}" data-v="agenda">Agenda${pa ? ` <span class="al">${pa}</span>` : ''}</button><button class="${vista==='flota'?'on':''}" data-v="flota">Flota${pf ? ` <span class="al">${pf}</span>` : ''}</button></nav>
  ${bajos ? `<div class="aviso">⚠ ${bajos} ${bajos === 1 ? 'pieza con stock bajo' : 'piezas con stock bajo'}</div>` : ''}`;
}
function ligar() {
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { vista = b.dataset.v; selId = null; selFlota = null; refrescar(); });
  $('#salir').onclick = () => sb.auth.signOut();
}
function lista() {
  selId = null;
  const f = [['activos','En el taller'],['todos','Todos'],...ESTADOS];
  const vis = vehs.filter(v => v.tipo === vista && (filtro === 'todos' ? true : filtro === 'activos' ? v.estado !== 'entregado' : v.estado === filtro));
  $('#app').innerHTML = `${cabecera()}<div style="margin-bottom:12px"><button class="acc" id="nuevo">+ Entrada</button></div>
  <div class="filtros">${f.map(([k,n]) => `<button class="sec ${filtro===k?'on':''}" data-f="${k}">${n}</button>`).join('')}</div>
  ${vis.length ? vis.map(v => { const t = v.tareas || [], h = t.filter(x => x.hecha).length; return `
  <button class="fila" style="--c:var(--${v.estado})" data-id="${v.id}">
    <div class="row"><b>${esc(v.nombre)}</b><span class="tag">${NOM[v.estado]}</span></div>
    <small>${v.tipo === 'motor' ? 'Motor' : 'Coche'}${v.matricula ? ' · ' + esc(v.matricula) : ''}${v.cliente ? ' · ' + esc(v.cliente) : ''}</small>
    <small>${t.length ? `Checklist: ${h} de ${t.length} hechas` : 'Sin tareas todavía'}</small></button>`; }).join('')
  : '<p class="vacio">No hay nada en esta lista. Pulsa «+ Entrada» para añadir ' + (vista === 'motor' ? 'un motor' : 'un coche') + '.</p>'}`;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filtro = b.dataset.f; lista(); });
  document.querySelectorAll('[data-id]').forEach(b => b.onclick = () => abrir(b.dataset.id));
  $('#nuevo').onclick = () => { $('#n_tipo').value = vista; $('#dlg').showModal(); };
  ligar();
}
async function abrir(id) {
  selId = id; await cargarDetalle(); detalle();
}
function detalle() {
  const v = vehs.find(x => x.id === selId); if (!v) return lista();
  $('#app').innerHTML = `<header><button class="sec" id="atras">‹ Taller</button>${me.rol === 'admin' ? '<button class="sec" id="borrar">Eliminar</button>' : ''}</header>
  <div class="box" style="border-left:8px solid var(--${v.estado})"><h2 style="margin:0">${esc(v.nombre)}</h2>
  <small style="color:var(--mut)">${v.tipo === 'motor' ? 'Motor' : 'Coche'}${v.matricula ? ' · ' + esc(v.matricula) : ''}${v.cliente ? ' · ' + esc(v.cliente) : ''}</small>
  <label for="est" style="display:block;margin-top:12px">Estado</label>
  <select id="est">${ESTADOS.map(([k,n]) => `<option value="${k}" ${k===v.estado?'selected':''}>${n}</option>`).join('')}</select>
  <label for="nt" style="display:block;margin-top:12px">Notas</label><textarea id="nt" rows="3">${esc(v.notas)}</textarea></div>
  <div class="box"><h2 style="margin:0 0 6px">Checklist</h2>
  ${tareas.length ? tareas.map(t => `<div class="tarea ${t.hecha?'ok':''}"><input type="checkbox" data-t="${t.id}" ${t.hecha?'checked':''} aria-label="Marcar hecha"><span>${esc(t.texto)}</span>${t.hecha && t.hecha_por ? `<small>${esc(t.hecha_por)}</small>` : ''}</div>`).join('') : '<p class="vacio">Aún no hay tareas. Añade la primera abajo.</p>'}
  <div class="add"><input id="nueva" placeholder="Qué hay que hacer…" aria-label="Nueva tarea"><button class="acc" id="addt">Añadir</button></div></div>${piezasHtml()}${horasHtml(v)}${prefacturaHtml(v)}${historialHtml()}`;
  $('#atras').onclick = () => { selId = null; lista(); };
  $('#est').onchange = async e => { await sb.from('vehiculos').update({ estado: e.target.value }).eq('id', v.id); refrescar(); };
  $('#nt').onblur = e => sb.from('vehiculos').update({ notas: e.target.value }).eq('id', v.id);
  document.querySelectorAll('[data-t]').forEach(c => c.onchange = async () => {
    await sb.from('tareas').update({ hecha: c.checked, hecha_por: c.checked ? me.nombre : null }).eq('id', c.dataset.t); refrescar();
  });
  const add = async () => { const t = $('#nueva').value.trim(); if (!t) return;
    await sb.from('tareas').insert({ vehiculo_id: v.id, texto: t }); await refrescar(); $('#nueva')?.focus(); };
  $('#addt').onclick = add; $('#nueva').onkeydown = e => { if (e.key === 'Enter') add(); };
  ligarPiezas(v); ligarFase3(v);
  if ($('#borrar')) $('#borrar').onclick = async () => {
    if (confirm('¿Eliminar «' + v.nombre + '» y todas sus tareas? No se puede deshacer.')) { await sb.from('vehiculos').delete().eq('id', v.id); selId = null; refrescar(); } };
}
function piezasHtml() {
  const filas = piezas.map(p => {
    const a = alm.find(x => x.id === p.almacen_id);
    let est = '<small class="warn">No está en el almacén: hay que pedirla</small>';
    if (p.montada) est = '<small class="oks">Montada</small>';
    else if (a) est = a.unidades >= p.cantidad ? `<small class="oks">En almacén: ${a.unidades} uds</small>` : `<small class="bad">Faltan: en almacén hay ${a.unidades} uds</small>`;
    return `<div class="pieza">${p.foto && urls[p.foto] ? `<img src="${esc(urls[p.foto])}" alt="Foto de ${esc(p.nombre)}" data-big="${esc(urls[p.foto])}">` : '<div class="sinfoto"></div>'}
    <div style="flex:1"><b>${p.cantidad} × ${esc(p.nombre)}</b>${est}
    <div style="display:flex;gap:6px;margin-top:6px">${p.montada ? '' : `<button class="sec" data-m="${p.id}">${a ? 'Montar y descontar' : 'Marcar montada'}</button>`}<button class="sec" data-dp="${p.id}">Quitar</button></div></div></div>`;
  }).join('');
  return `<div class="box"><h2 style="margin:0 0 6px">Piezas necesarias</h2>${filas || '<p class="vacio">Aún no has añadido piezas.</p>'}
  <label for="p_alm" style="display:block;margin-top:10px">Pieza del almacén</label>
  <select id="p_alm"><option value="">— No está en el almacén / nueva —</option>${alm.map(a => `<option value="${a.id}">${esc(a.nombre)} (${a.unidades} uds)</option>`).join('')}</select>
  <label for="p_nom" style="display:block;margin-top:10px">Nombre</label><input id="p_nom" placeholder="Ej. Kit de embrague">
  <label for="p_cant" style="display:block;margin-top:10px">Cantidad</label><input id="p_cant" type="number" min="1" value="1">
  <label for="p_foto" style="display:block;margin-top:10px">Foto (opcional)</label><input id="p_foto" type="file" accept="image/*">
  <p class="err" id="p_err"></p><button class="acc" id="addp">Añadir pieza</button></div>`;
}
function ligarPiezas(v) {
  $('#p_alm').onchange = e => { const a = alm.find(x => x.id === e.target.value); if (a) $('#p_nom').value = a.nombre; };
  document.querySelectorAll('[data-big]').forEach(i => i.onclick = () => window.open(i.dataset.big));
  document.querySelectorAll('[data-dp]').forEach(b => b.onclick = async () => { if (confirm('¿Quitar esta pieza?')) { await sb.from('piezas').delete().eq('id', b.dataset.dp); refrescar(); } });
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
    const p = piezas.find(x => x.id === b.dataset.m), a = alm.find(x => x.id === p.almacen_id);
    const r = await sb.rpc('usar_pieza', { pid: p.id });
    if (r.error || r.data === false) return alert('No hay unidades suficientes en el almacén.');
    if (a) await sb.from('lineas_prefactura').insert({ vehiculo_id: p.vehiculo_id, tipo: 'Pieza', descripcion: p.nombre, cantidad: p.cantidad, precio: a.precio || 0 });
    refrescar();
  });
  $('#addp').onclick = async () => {
    const nombre = $('#p_nom').value.trim();
    if (!nombre) { $('#p_err').textContent = 'Escribe el nombre de la pieza.'; return; }

  <div class="lin"><label>Fecha<input id="m_fec" type="date" value="${hoyISO()}"></label><label>Km<input id="m_km" type="number" min="0" value="${f.km ?? ''}"></label><label>Coste €<input id="m_cos" type="number" min="0" step="0.01"></label></div>
  <label for="m_txt" style="display:block;margin-top:10px">Qué se ha hecho</label><textarea id="m_txt" rows="3" placeholder="Aceite y filtros, neumáticos, frenos…"></textarea>
  <label for="m_foto" style="display:block;margin-top:10px">Foto (opcional)</label><input id="m_foto" type="file" accept="image/*"><button class="acc" id="m_add" style="margin-top:10px">Guardar mantenimiento</button></div>`;
  $('#atrasf').onclick = () => { selFlota = null; flotaView(); };
  document.querySelectorAll('[data-big]').forEach(i => i.onclick = () => window.open(i.dataset.big));
  const upd = (id, k, fn) => $(id).onchange = async e => { e.target.blur(); await sb.from('flota').update({ [k]: fn(e.target.value) }).eq('id', f.id); refrescar(); };
  upd('#fk', 'km', x => parseInt(x) || null); upd('#fi', 'itv_fecha', x => x || null); upd('#fs', 'seguro_fecha', x => x || null);
  document.querySelectorAll('[data-dfm]').forEach(b => b.onclick = async () => { if (confirm('¿Borrar esta anotación?')) { await sb.from('flota_mant').delete().eq('id', b.dataset.dfm); refrescar(); } });
  $('#m_add').onclick = async () => {
    const texto = $('#m_txt').value.trim(); if (!texto) return;
    $('#m_add').disabled = true; let foto = null; const fl = $('#m_foto').files[0];
    if (fl) {
      foto = 'flota/' + f.id + '/' + crypto.randomUUID() + '.jpg';
      const up = await sb.storage.from('fotos').upload(foto, await comprimir(fl), { contentType: 'image/jpeg' });
      if (up.error) { alert('No se pudo subir la foto.'); $('#m_add').disabled = false; return; }
    }
    const km = parseInt($('#m_km').value) || null;
    await sb.from('flota_mant').insert({ flota_id: f.id, fecha: $('#m_fec').value || hoyISO(), km, texto, coste: parseFloat($('#m_cos').value) || null, foto, autor: me.nombre });
    if (km && km > (f.km || 0)) await sb.from('flota').update({ km }).eq('id', f.id);
    refrescar();
  };
  if ($('#borrarf')) $('#borrarf').onclick = async () => { if (confirm('¿Eliminar «' + f.nombre + '» y todo su historial?')) { await sb.from('flota').delete().eq('id', f.id); selFlota = null; refrescar(); } };
}
$('#f_cancel').onclick = () => $('#dlgf').close();
$('#fnuevof').onsubmit = async () => {
  await sb.from('flota').insert({ nombre: $('#f_nom').value.trim(), tipo: $('#f_tipo').value, matricula: $('#f_mat').value.trim() || null, km: parseInt($('#f_km').value) || null, itv_fecha: $('#f_itv').value || null, seguro_fecha: $('#f_seg').value || null });
  $('#fnuevof').reset(); refrescar();
};
function almacenView() {
  selId = null;
  const orden = [...alm].sort((x, y) => (y.unidades <= y.minimo) - (x.unidades <= x.minimo));
  $('#app').innerHTML = `${cabecera()}<div style="margin-bottom:12px"><button class="acc" id="nuevoa">+ Pieza al almacén</button></div>
  ${orden.length ? orden.map(a => { const bajo = a.unidades <= a.minimo; return `<div class="fila" style="--c:${bajo ? '#d23b3b' : 'var(--listo)'}">
    <div class="row"><b>${esc(a.nombre)}</b><span class="tag">${bajo ? '⚠ Stock bajo' : 'OK'}</span></div>
    <small>${a.referencia ? 'Ref. ' + esc(a.referencia) + ' · ' : ''}${a.ubicacion ? esc(a.ubicacion) + ' · ' : ''}Avisa con ${a.minimo} o menos · Venta: ${eur(a.precio)}</small>
    <div class="row" style="margin-top:8px;align-items:center"><div><button class="sec" data-u="${a.id}" data-d="-1" aria-label="Quitar una unidad">−</button><b style="font-size:22px;margin:0 10px">${a.unidades}</b><button class="sec" data-u="${a.id}" data-d="1" aria-label="Añadir una unidad">+</button></div>
    <div><button class="sec" data-min="${a.id}">Mínimo</button> <button class="sec" data-pre="${a.id}">Precio</button>${me.rol === 'admin' ? ` <button class="sec" data-da="${a.id}">Quitar</button>` : ''}</div></div></div>`; }).join('')
  : '<p class="vacio">El almacén está vacío. Añade la primera pieza.</p>'}`;
  ligar();
  $('#nuevoa').onclick = () => $('#dlga').showModal();
  document.querySelectorAll('[data-u]').forEach(b => b.onclick = async () => {
    const a = alm.find(x => x.id === b.dataset.u);
    await sb.from('almacen').update({ unidades: Math.max(0, a.unidades + +b.dataset.d) }).eq('id', a.id); refrescar(); });
  document.querySelectorAll('[data-min]').forEach(b => b.onclick = async () => {
    const a = alm.find(x => x.id === b.dataset.min), n = prompt('Avisar cuando queden este número de unidades o menos:', a.minimo);
    if (n !== null && n.trim() !== '' && !isNaN(n)) { await sb.from('almacen').update({ minimo: Math.max(0, +n) }).eq('id', a.id); refrescar(); } });
  document.querySelectorAll('[data-pre]').forEach(b => b.onclick = async () => {
    const a = alm.find(x => x.id === b.dataset.pre), n = parseFloat(String(prompt('Precio de venta por unidad (€):', a.precio) || '').replace(',', '.'));
    if (!isNaN(n) && n >= 0) { await sb.from('almacen').update({ precio: n }).eq('id', a.id); refrescar(); } });
  document.querySelectorAll('[data-da]').forEach(b => b.onclick = async () => {
    if (confirm('¿Quitar esta pieza del almacén?')) { await sb.from('almacen').delete().eq('id', b.dataset.da); refrescar(); } });
}
$('#a_cancel').onclick = () => $('#dlga').close();
$('#fnuevoa').onsubmit = async () => {
  await sb.from('almacen').insert({ nombre: $('#a_nom').value.trim(), referencia: $('#a_ref').value.trim() || null, ubicacion: $('#a_ubi').value.trim() || null, unidades: +$('#a_uni').value || 0, minimo: +$('#a_min').value || 0, precio: parseFloat($('#a_pre').value) || 0 });
  $('#fnuevoa').reset(); refrescar();
};
$('#n_cancel').onclick = () => $('#dlg').close();
$('#fnuevo').onsubmit = async () => {
  await sb.from('vehiculos').insert({ tipo: $('#n_tipo').value, nombre: $('#n_nombre').value.trim(), matricula: $('#n_mat').value.trim() || null, cliente: $('#n_cli').value.trim() || null });
  $('#fnuevo').reset(); refrescar();
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
boot();
</script>
